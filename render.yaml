# Render Blueprint for apps/api. Repo root is the service root since this
# is an npm-workspaces monorepo - the build/start commands are scoped to
# apps/api explicitly instead.
#
# `sync: false` env vars are declared here so Render knows they exist, but
# their actual values are never committed - set them in the dashboard
# after the first deploy. Double-check `preDeployCommand` against Render's
# current docs/dashboard before relying on blueprint sync; if it doesn't
# take, set the equivalent "Pre-Deploy Command" field manually instead.
#
# preDeployCommand must `cd apps/api` rather than pass `--schema` from the
# repo root - Prisma 7's config system (prisma.config.ts, which is what
# actually supplies datasource.url here, not schema.prisma) is discovered
# relative to the current working directory, not relative to --schema.
# Running from the repo root with just --schema fails with "The
# datasource.url property is required in your Prisma config file".
services:
  - type: web
    name: tony-chou-portfolio-api
    runtime: node
    plan: free
    buildCommand: npm install && npm run build --workspace=apps/api
    startCommand: npm run start:prod --workspace=apps/api
    preDeployCommand: cd apps/api && npx prisma migrate deploy
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5
      # Which provider serves AI calls: 'anthropic' (direct API) or 'bedrock'
      # (the same Claude models on Amazon Bedrock), spec 0005's provider swap.
      #
      # Declared here rather than left to the dashboard because a dashboard-only
      # variable is invisible to this repo: nothing in the tree recorded that
      # production runs on Bedrock, and the only way to find out was to read a
      # ConversationService log line. That is the same silent-configuration
      # shape that let the Bedrock budget read $0.00 against real charges.
      #
      # NOT inert, and the reason changed in spec 0006 R5. Bedrock's Anthropic
      # surface rejects URL image sources, which used to make Grade Guesser's
      # vision call impossible here. The seam now carries base64 bytes, which
      # both providers accept, so this no longer blocks the game — but it does
      # decide WHICH model grades it: the grader pins a Bedrock id under this
      # setting and a first party id otherwise (grade.constants.ts).
      - key: AI_PROVIDER
        value: bedrock
      # Required by the boot guard whenever AI_PROVIDER=bedrock — the factory
      # fails startup if any is missing rather than failing at first request.
      # Declared as sync: false so the repo records that they exist; the values
      # are dashboard-only and never committed.
      - key: AWS_REGION
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      # Optional; falls back to DEFAULT_BEDROCK_MODEL_ID when unset. It IS set
      # in the dashboard today — production log lines report the served model
      # as us.anthropic.claude-sonnet-4-6, which is not the code default.
      - key: BEDROCK_MODEL_ID
        sync: false
      - key: IP_HASH_SALT
        sync: false
      # Beta's in-process output guard (spec 0005 guardrails child).
      # 'off' | 'shadow' | 'enforce'; anything else resolves to 'off'.
      # QUOTED deliberately: unquoted `off` is boolean false in YAML, which
      # would hand the process the string "false" instead.
      #   off     - layer 2 never runs; the coach streams live. Layer 1's
      #             drafter schema and prohibition checks run regardless.
      #   shadow  - buffers the coach, evaluates, counts and logs, but shows
      #             the coach's prose unchanged. Gate on enforce (AC-G9).
      #   enforce - substitutes a plan rendered from the drafter object when
      #             the coach's prose fires a rule.
      # Shadow and enforce both buffer the coach, but the plan no longer
      # waits on it: the validated plan is rendered and sent as soon as the
      # drafter returns, then upgraded to the coach's prose once the guard
      # passes. Time to first plan text is the same as it was at 'off'.
      - key: BETA_OUTPUT_GUARD_MODE
        value: 'enforce'
      # Grade Guesser (spec 0006) is built to revised-plan step R2: no share
      # button, no home page teaser, and the photo pool is EMPTY (the upload
      # that fills it is R3), so /grade/today would serve 503 even if enabled.
      # Disabled means GradeModule is NOT REGISTERED, so /grade/* has no
      # handler, no DTO and no database access to reach, rather than existing
      # and refusing. The web route 404s on the same variable.
      # Release is flipping this to 'true' here AND setting GRADE_GAME_ENABLED
      # in Vercel; absence means off on both sides, so it cannot go live by
      # forgetting to set something.
      - key: GRADE_GAME_ENABLED
        value: 'false'
      # The private photo bucket (spec 0006 R1). Copy the terraform
      # `grade_photo_bucket` output into the dashboard; nothing wires it
      # automatically. Unlike the flag above, this is NOT inert once set —
      # but nothing reads it until the upload endpoint lands in R3.
      - key: GRADE_PHOTO_BUCKET
        sync: false
      - key: TURN_PAIR_CAP
        value: '5'
      - key: DAILY_TURN_CAP
        value: '300'
      - key: DAILY_TOKEN_CAP
        value: '150000'
      - key: CORS_ORIGIN
        sync: false
      - key: BETTER_AUTH_SECRET
        sync: false
      - key: INTERNAL_ADMIN_EMAIL
        sync: false
      - key: INTERNAL_ADMIN_PASSWORD
        sync: false

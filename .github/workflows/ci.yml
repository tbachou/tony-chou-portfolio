# The verification loop that runs without anyone watching (Cherny step-2
# guardrail): typecheck, lint, and the Beta safety regression tests on every
# push. Deploys (Vercel/Render) trigger independently of this — a red run
# here is the alarm, not the gate, until a PR flow exists.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read only, stated rather than inherited. The other three workflows declare
# theirs explicitly; this one relied on the platform default for fork PRs.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # prisma.config.ts resolves env("DATABASE_URL") at load time; `prisma
      # generate` (postinstall) never connects, it just needs the var set.
      #
      # The boot smoke test below needs it parseable but NOT reachable.
      # PrismaService.onModuleInit calls $connect(), but the pg adapter does
      # not open a connection eagerly, so the app boots and serves /health
      # against a dead address. Verified 2026-09-20 by booting the built
      # server against a closed port. That is why this job runs no postgres
      # service: adding one would slow every run and prove nothing.
      DATABASE_URL: postgres://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Before the expensive steps: this one needs no dependencies and no
      # network, and it catches the skill-layout drift that would otherwise
      # reach every clone and worktree (spec 0007). The local pre-commit run
      # is the primary gate; this is the backstop.
      - name: Check skill layout
        run: npm run check:skills

      # The site build refuses to render an inconsistent eval record, but a
      # build failure names a page, not a manifest. Running the same loader
      # as its own check means a mistyped `published.json` fails here, with
      # the offending path in the message, before a deploy is attempted
      # (spec 0012 phase two). No network, no API key: it reads committed
      # files only.
      - name: Check published evals record
        run: npm run check:evals

      # Catches the drift the eval workflow structurally cannot: `evals.yml`
      # does not trigger on `docs/specs/**`, but writing a spec is exactly what
      # changes the retrieval corpus. Reads committed files only, contacts
      # Upstash never, needs no credentials, so it runs on fork pull requests
      # like everything else here.
      - name: Check retrieval corpus is embedded
        run: npm run check:corpus --workspace=apps/api

      # The published API document, guarded three ways (spec 0016): the route
      # registry against the controllers, every input binding against its
      # validation pipe, and both committed artifacts against a fresh
      # generation. The auth half is why it runs on a public repository at
      # all — a route wrongly marked anonymous in `docs/api/` is a false
      # security claim anyone can read. Committed files only: no network, no
      # database, no environment variable, so fork pull requests run it too.
      - name: Check API document matches the code
        run: npm run check:openapi --workspace=apps/api

      - name: Typecheck API
        run: npx tsc --noEmit -p apps/api/tsconfig.json

      # Typechecking is not building. `nest build --builder swc` resolves and
      # loads @swc/cli and @swc/core, and @swc/core ships platform specific
      # native binaries, so a build that works on a developer's macOS says
      # nothing about Render's linux x64. A dev dependency bump broke exactly
      # this on 2026-08-30: every check here passed, main merged, and the
      # deploy failed on `Failed to load "@swc/cli" and/or "@swc/core"`. This
      # runner is ubuntu, the same as Render's builder, so running the real
      # build is what closes that gap.
      - name: Build API (same builder Render runs)
        run: npm run build --workspace=apps/api

      # Building is not running. The failures a framework or module system
      # migration actually produces (an import cycle, reflect-metadata
      # evaluated too late, a CommonJS package whose named exports do not
      # resolve) all typecheck clean and all fail at boot. Render is the
      # only place that used to find out, and it found out in production.
      #
      # This runs the built output exactly as Render's startCommand does, on
      # the same linux x64 and Node 22, and waits for /health. It is not a
      # substitute for a Render deploy, but it closes the gap that mattered.
      - name: Boot the built API and check /health
        env:
          NODE_ENV: production
          PORT: '3001'
          IP_HASH_SALT: ci-not-a-secret
          ANTHROPIC_API_KEY: sk-ci-placeholder-never-called
          CORS_ORIGIN: http://localhost:3000
          BETTER_AUTH_SECRET: ci-not-a-secret-but-long-enough-to-pass
        run: |
          node apps/api/dist/main.js &
          api_pid=$!
          for i in $(seq 1 30); do
            sleep 1
            if curl -sf http://127.0.0.1:3001/health -o /tmp/health.json; then
              echo "booted ok: $(cat /tmp/health.json)"
              kill "$api_pid" 2>/dev/null || true
              exit 0
            fi
            if ! kill -0 "$api_pid" 2>/dev/null; then
              echo "::error::the API process exited before answering /health"
              exit 1
            fi
          done
          echo "::error::the built API did not answer /health within 30s"
          kill "$api_pid" 2>/dev/null || true
          exit 1

      - name: Typecheck web
        run: npx tsc --noEmit -p apps/web/tsconfig.json

      # Typechecking web is not the same as building it, and the difference is
      # a whole class of failure this job could not see. A tsc pass never runs
      # PostCSS, never resolves the Tailwind plugin chain, never bundles a
      # client component and never renders a static route, so anything that
      # breaks only in those stages reached Vercel with `verify` green.
      #
      # Demonstrated on 2026-08-31 by #42 (tailwindcss 3 to 4): `verify`
      # passed, and the Vercel build died on the Tailwind PostCSS plugin move.
      # The same day #51 (typescript 7) did fail `verify`, because it broke a
      # typecheck and the streamflow build that `postinstall` runs, which is
      # the distinction worth keeping straight: this step is not a catch all,
      # it closes the web build shaped hole specifically.
      #
      # Render's build was added to this job for exactly this reason in #36,
      # after a dependency bump broke `main`'s deploy. This is the same fix on
      # the web side. Verified to pass with no environment variables set: the
      # only dynamic route is `/streamflow`, which is `force-dynamic` and so
      # reads the store at request time, never at build time.
      - name: Build web (same builder Vercel runs)
        run: npm run build --workspace=apps/web

      - name: Typecheck streamflow
        run: npx tsc --noEmit -p apps/streamflow/tsconfig.json

      - name: Typecheck feedback classifier Lambda
        run: npx tsc --noEmit -p infra/lambda/feedback-classifier/tsconfig.json

      - name: Lint
        run: npm run lint

      - name: Beta safety regression tests
        run: npm test --workspace=apps/api

      # The web app's own safety-critical rendering: that the educational
      # framing reaches the screen on both the coach and guard-fallback
      # paths, what the clipboard carries, and that the plan parser cannot
      # drop or misfile content. Those guarantees live only in the browser
      # layer, so the api suite above cannot see them.
      - name: Beta rendering safety tests (web)
        run: npm test --workspace=apps/web

      - name: Feedback classifier Lambda tests
        run: npm test --workspace=infra/lambda/feedback-classifier -- --ci

      # Spec 0010's pipeline. Fully mocked like the rest: no database, no
      # network. The checks that need a real store live in
      # apps/streamflow/scripts and are run by hand against a throwaway.
      - name: Streamflow pipeline tests
        run: npm test --workspace=apps/streamflow -- --ci

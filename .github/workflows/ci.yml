# The verification loop that runs without anyone watching (Cherny step-2
# guardrail): typecheck, lint, and the Beta safety regression tests on every
# push. Deploys (Vercel/Render) trigger independently of this — a red run
# here is the alarm, not the gate, until a PR flow exists.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # prisma.config.ts resolves env("DATABASE_URL") at load time; `prisma
      # generate` (postinstall) never connects, it just needs the var set.
      DATABASE_URL: postgres://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Before the expensive steps: this one needs no dependencies and no
      # network, and it catches the skill-layout drift that would otherwise
      # reach every clone and worktree (spec 0007). The local pre-commit run
      # is the primary gate; this is the backstop.
      - name: Check skill layout
        run: npm run check:skills

      - name: Typecheck API
        run: npx tsc --noEmit -p apps/api/tsconfig.json

      - name: Typecheck web
        run: npx tsc --noEmit -p apps/web/tsconfig.json

      - name: Typecheck streamflow
        run: npx tsc --noEmit -p apps/streamflow/tsconfig.json

      - name: Typecheck feedback classifier Lambda
        run: npx tsc --noEmit -p infra/lambda/feedback-classifier/tsconfig.json

      - name: Lint
        run: npm run lint

      - name: Beta safety regression tests
        run: npm test --workspace=apps/api -- --ci

      # The web app's own safety-critical rendering: that the educational
      # framing reaches the screen on both the coach and guard-fallback
      # paths, what the clipboard carries, and that the plan parser cannot
      # drop or misfile content. Those guarantees live only in the browser
      # layer, so the api suite above cannot see them.
      - name: Beta rendering safety tests (web)
        run: npm test --workspace=apps/web

      - name: Feedback classifier Lambda tests
        run: npm test --workspace=infra/lambda/feedback-classifier -- --ci

      # Spec 0010's pipeline. Fully mocked like the rest: no database, no
      # network. The checks that need a real store live in
      # apps/streamflow/scripts and are run by hand against a throwaway.
      - name: Streamflow pipeline tests
        run: npm test --workspace=apps/streamflow -- --ci

# Interview simulator eval suite (spec 0011, AC-8). Report only: no score,
# however bad, fails this job — the scoreboard lands in the job summary and
# the results JSON in an artifact. CI never commits or pushes anything; the
# committed baseline moves only by a deliberate local run (AC-9).
#
# Security model (spec 0011): runs on `pull_request` (never
# `pull_request_target`), token scoped to contents: read, fork PRs excluded
# by the same-repo guard (they get no secrets anyway; the guard makes the
# skip explicit instead of a confusing key-missing run). No third-party
# actions; first-party actions ride the same major tags as ci.yml.
name: Evals

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/api/src/modules/conversation/**'
      - 'apps/api/prisma/fixtures.ts'
      - 'apps/api/scripts/interview-eval/**'
      - '.github/workflows/evals.yml'

permissions:
  contents: read

# One eval run per ref at a time: a force-push mid-run cancels the stale run
# rather than spending API budget twice.
concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  interview-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Same-repo guard: fork PRs are excluded by design (AC-8).
    #
    # `skip-evals` is a deliberate per-PR opt-out for a change that cannot move
    # the scores (a pure refactor under the watched paths, a comment, a test).
    # Runs cost real Anthropic budget, so the escape hatch is explicit rather
    # than a narrower path filter: the prompt is assembled in
    # conversation.service.ts as well as in the skill files, so narrowing the
    # paths would silently skip the runs that matter most.
    #
    # Labels are read when the event fires. `pull_request` here triggers on
    # opened/synchronize/reopened, so labelling an open PR does not cancel a
    # run already in flight; it takes effect from the next push.
    #
    # workflow_dispatch always runs the full set: on dispatch there is no
    # pull_request object, the label list is empty, and the guard passes.
    if: >-
      (
        github.event_name == 'workflow_dispatch' ||
        github.event.pull_request.head.repo.full_name == github.repository
      ) &&
      !contains(github.event.pull_request.labels.*.name, 'skip-evals')
    env:
      # prisma.config.ts resolves env("DATABASE_URL") at load time; `prisma
      # generate` (postinstall) never connects, it just needs the var set.
      DATABASE_URL: postgres://ci:ci@localhost:5432/ci
      # The eval suite pins the direct Anthropic API (spec 0011): a Bedrock
      # comparison is a deliberate local run, never CI.
      AI_PROVIDER: anthropic
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # Retrieval (spec 0012 phase three). READ ONLY token: the write token
      # exists only where the embed script runs and must never be set here.
      #
      # Without these the run does not quietly lose retrieval and score as
      # though nothing changed, which is what AC-9 forbids and what this job
      # would have done before the preflight landed. It refuses instead,
      # before spending anything. So a missing secret is a loud, cheap
      # failure rather than an expensive, silent one.
      UPSTASH_VECTOR_REST_URL: ${{ secrets.UPSTASH_VECTOR_REST_URL }}
      UPSTASH_VECTOR_REST_TOKEN: ${{ secrets.UPSTASH_VECTOR_REST_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Run interview eval
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            {
              echo '### Interview eval: skipped'
              echo 'The `ANTHROPIC_API_KEY` repository secret is not configured; no eval run happened.'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # PR runs are capped (--cases 8, sampled across all difficulty
          # tiers, so edge bait cases always run); dispatch runs the full set.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            CASE_ARGS="--cases 8"
          else
            CASE_ARGS=""
          fi
          npm run eval:interview --workspace=apps/api -- $CASE_ARGS
          {
            echo '### Interview eval scoreboard'
            echo ''
            cat docs/evals/interview/scoreboard.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: interview-eval-results
          path: docs/evals/interview/results/
          if-no-files-found: ignore

# Automated Claude code review on pull requests (Cherny step-2: review
# before human eyes). Dormant until a PR flow exists — pushes straight to
# main never trigger it. Requires the ANTHROPIC_API_KEY repository secret
# (GitHub → Settings → Secrets and variables → Actions) before first use;
# each run bills API tokens.
name: Claude Auto Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            Please review this pull request with a focus on:
            - Correctness bugs and security implications first
            - The Beta module's invariants when touched: nothing a visitor
              types is ever stored or logged; red-flag symptoms block in
              code before any model call; counters increment on success
              only via the atomic reservation; rate-limit identity uses
              the IPv6 /64 prefix
            - Code quality and performance second
            Note: The PR branch is already checked out in the current working directory.
            Use `gh pr comment` for top-level feedback.
            Use `mcp__github_inline_comment__create_inline_comment` (with `confirmed: true`) to highlight specific code issues.
            Only post GitHub comments - don't submit review text as messages.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

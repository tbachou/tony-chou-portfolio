# Spec 0010's scoring pass: judge every prediction whose target instant has
# passed against whatever revision of the truth is current.
#
# Hourly rather than six hourly, and separate from the pipeline workflow for
# that reason. Scoring is cheap, it depends on nothing the pipeline produces
# in the same run, and a prediction whose target has just passed should not
# wait most of a day to be judged. Waiting for USGS to approve a reading would
# be worse still: the dashboard would sit months stale.
#
# Re-running is safe and expected. A score is never edited; when a revision
# changes the truth, a second score is written naming the newer revision, and
# the unique key on (predictionId, actualRecordedAt) is what makes a repeat
# run write nothing rather than write a duplicate.
#
# Same hardening as the pipeline workflow, and for the same reason: this holds
# a write credential in a public repository.
#
#   - schedule and workflow_dispatch only, so nothing an outside contributor
#     can trigger ever reaches this token.
#   - no ${{ github.event.* }} in any run block, so there is no injection sink.
#   - the secret is scoped to the one step that needs it, not to the job.
#   - actions pinned to commit SHAs, kept current by Dependabot.
name: Streamflow scoring

on:
  schedule:
    - cron: '30 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  # Its own group. Scoring writes only score rows and the pipeline writes only
  # observations and predictions, so the two need not queue behind each other;
  # two scoring passes at once would simply repeat work.
  group: streamflow-scoring
  cancel-in-progress: false

jobs:
  score:
    # The same switch the pipeline's prediction step reads, for the same
    # reason: scoring exists to judge predictions, so it has nothing to do
    # until forecasting is on. Gating the job rather than the step means an
    # hourly cron does not spend a runner to discover there is no work.
    if: ${{ vars.STREAMFLOW_FORECASTING == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # apps/api's prisma.config.ts resolves env("DATABASE_URL") at load time
      # and its postinstall runs `prisma generate` on every `npm ci`. This
      # dummy value only has to exist; generate never connects.
      DATABASE_URL: postgres://ci:ci@localhost:5432/ci

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Score predictions
        env:
          PIPELINE_DATABASE_URL: ${{ secrets.PIPELINE_DATABASE_URL }}
        run: npm run score --workspace=apps/streamflow

# Spec 0010's scoring pass: judge every prediction whose target instant has
# passed against whatever revision of the truth is current.
#
# Hourly rather than six hourly, and separate from the pipeline workflow for
# that reason. Scoring is cheap, it depends on nothing the pipeline produces
# in the same run, and a prediction whose target has just passed should not
# wait most of a day to be judged. Waiting for USGS to approve a reading would
# be worse still: the dashboard would sit months stale.
#
# Re-running is safe and expected. A score is never edited; when a revision
# changes the truth, a second score is written naming the newer revision, and
# the unique key on (predictionId, actualRecordedAt) is what makes a repeat
# run write nothing rather than write a duplicate.
#
# Same hardening as the pipeline workflow, and for the same reason: this holds
# a write credential in a public repository.
#
#   - schedule and workflow_dispatch only, so nothing an outside contributor
#     can trigger ever reaches this token.
#   - no ${{ github.event.* }} in any run block, so there is no injection sink.
#   - the secret is scoped to the one step that needs it, not to the job.
#   - actions pinned to commit SHAs, kept current by Dependabot.
name: Streamflow scoring

on:
  schedule:
    - cron: '30 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  # The pipeline's group, deliberately, not one of its own. This used to be
  # `streamflow-scoring`, on the reasoning that scoring writes only score rows
  # while the pipeline writes only observations and predictions, so neither
  # needed to wait for the other. Applying migrations here retired that
  # reasoning: this workflow now issues DDL, and an `ALTER TABLE` waiting on a
  # lock the pipeline's open write transaction holds queues an
  # AccessExclusiveLock. Postgres grants locks in order, so every dashboard
  # read arriving behind it waits too, and the public site stalls until the
  # ingest commits.
  #
  # Sharing the group means the two can never be in flight together, so that
  # contention cannot arise. The cost is an occasional scoring run queued
  # behind a pipeline run, which is cheap: the pipeline finishes in about a
  # minute and scoring is hourly.
  group: streamflow-pipeline
  cancel-in-progress: false

jobs:
  score:
    # The same switch the pipeline's prediction step reads, for the same
    # reason: scoring exists to judge predictions, so it has nothing to do
    # until forecasting is on. Gating the job rather than the step means an
    # hourly cron does not spend a runner to discover there is no work.
    if: ${{ vars.STREAMFLOW_FORECASTING == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # apps/api's prisma.config.ts resolves env("DATABASE_URL") at load time
      # and its postinstall runs `prisma generate` on every `npm ci`. This
      # dummy value only has to exist; generate never connects.
      DATABASE_URL: postgres://ci:ci@localhost:5432/ci

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Apply pending migrations
        # Same reason as the pipeline workflow, and it has to be here too
        # rather than only there. This workflow is the second scheduled entry
        # point into the same database, and it runs hourly while the pipeline
        # runs every six hours, so between a merge that adds a migration and
        # the next pipeline run this job would otherwise meet a database older
        # than its own client for up to six hours.
        #
        # That is not hypothetical. On 2026-08-30 the run recording a weather
        # backfill's lead added `pipeline_runs.leadHours`, and the 16:35 and
        # 17:36 scoring passes both failed on it before the 18:13 pipeline run
        # applied the migration. Scoring never sets that column; it failed
        # because `pipelineRun.create()` names every column of the model in its
        # RETURNING clause, so any column the database is missing breaks the
        # insert whatever the job was writing.
        #
        # Safe to run from two workflows. `migrate deploy` takes a Postgres
        # advisory lock, so two runs never apply the same migration twice, and
        # the shared concurrency group above means this workflow and the
        # pipeline cannot be in flight together in the first place.
        #
        # The lock is still the backstop that matters, because it is the only
        # thing guarding against a `migrate deploy` run from outside Actions,
        # from somebody's laptop against production. Worth knowing what it
        # actually promises: the wait is capped at 10 seconds, so a contending
        # run does not queue politely, it exits with P1002 once that elapses.
        # Safe for the data either way, and it fails the run rather than
        # blocking it. A run with nothing pending is a no-op costing seven
        # statements.
        env:
          PIPELINE_DATABASE_URL: ${{ secrets.PIPELINE_DATABASE_URL }}
        run: npm run migrate:deploy --workspace=apps/streamflow

      - name: Score predictions
        # Runs even when the migration step failed, matching the pipeline
        # workflow's own steps. A half applied migration leaves a failed row
        # that makes every later `migrate deploy` exit P3009 until a human runs
        # `prisma migrate resolve`, and that state is sticky. Scoring itself is
        # usually fine in it, so without this guard one stuck migration would
        # stop the public scorecard 24 times a day for a reason unrelated to
        # scoring. If the schema really is too old to score against, this step
        # fails on its own merits and says so.
        if: ${{ !cancelled() }}
        env:
          PIPELINE_DATABASE_URL: ${{ secrets.PIPELINE_DATABASE_URL }}
        run: npm run score --workspace=apps/streamflow

version: 2

# Beta is feature frozen but still maintained (spec 0004), and the rest of the
# repo is actively built on. Either way the risk is the same: nobody notices a
# dependency going bad until an unrelated `npm audit` happens to be run. This
# turns that into a notification.
#
# Updates are GROUPED on purpose. A portfolio repo does not want twenty open
# pull requests; it wants one to look at on a Monday. Security updates are
# ungrouped and separate so they are never buried in a routine bump.
updates:
  - package-ecosystem: npm
    # Root only: npm workspaces means this one manifest covers apps/web,
    # apps/api and packages/shared.
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # PRODUCTION majors stay out of the groups, so a breaking change to
      # something that actually ships always arrives as its own pull request
      # with its own changelog to read. The known one today is Next 16, which
      # the sharp/libvips advisories require and which `npm audit fix` will
      # not do without --force.
      production-minor-and-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
      # Development majors stay out too, for the same reason, and this line
      # is the second attempt at it. Grouping development majors was tried on
      # 2026-08-31 and reverted the same day, so the reasoning is written down
      # rather than left to be rediscovered.
      #
      # The argument for grouping was that a development major does not need
      # its changelog read the way a shipped one does: it either builds and
      # passes the suites or it does not. That is true and beside the point.
      # What keeping majors separate actually buys is ISOLATION, not reading
      # time. The first grouped run produced a single pull request of nineteen
      # updates in which ten were routine and nine could not be taken at all
      # (typescript 7 removing a moduleResolution three tsconfigs still use,
      # tailwindcss 4, the NestJS 11 to 12 family, @types/node 26, archiver 8).
      # Grouped, the ten good ones could not merge until every one of the nine
      # was individually ignored, discovered one failed deploy at a time.
      # Separated, the ten merge as one weekly pull request and the nine fail
      # alone and harmlessly, which is what this config did before.
      #
      # The noise the grouping was meant to fix is real, but `ignore` is the
      # tool for it, not grouping. An ignore entry also records the decision,
      # which is the part that was actually missing: @types/node 26 was closed
      # as #5 and came straight back as #43, because closing a pull request
      # records nothing anywhere.
      development-minor-and-patch:
        dependency-type: development
        update-types:
          - minor
          - patch
    ignore:
      # NOTE: `ignore` cannot filter by dependency-type, and it applies to
      # security updates as well as routine ones. So every entry here is a
      # deliberate decision to not hear about a package, including when the
      # reason would be a vulnerability. Keep the list short and named; never
      # reach for a `dependency-name: "*"` major rule, which would silence the
      # Next 16 upgrade the sharp/libvips advisories need.
      #
      # This entry now does a second job. With development majors grouped
      # above, an eslint 10 bump would land inside that group and fail it as a
      # whole, so removing this would not just re-open a known-bad upgrade, it
      # would break every grouped dev pull request until someone noticed why.
      #
      # Naming `eslint` alone was not enough, and the grouping above is what
      # exposed it. `@eslint/js` and `@eslint/eslintrc` ship in lockstep with
      # eslint, and `@eslint/js@10` peer requires `eslint@^10`, so bumping it
      # while eslint is held at 9 cannot install at all. Proven on 2026-08-31:
      # the first grouped development pull request (#49, twenty updates) took
      # `@eslint/js` to 10.0.1 and died on Vercel with an ERESOLVE before any
      # build step ran, holding nineteen good updates hostage to one bad one.
      #
      # Listed by name rather than as `@eslint/*` on purpose: a wildcard that
      # turns out not to match fails silently, which is the same class of
      # mistake as the one this entry is fixing. A new `@eslint/` sibling
      # entering the manifests needs adding here by hand.
      #
      # `eslint-config-next@16` is deliberately NOT ignored. It widens its
      # eslint peer to >=9.0.0, so it installs fine against eslint 9 and is
      # part of the path off this pin rather than another thing blocking it.
      - dependency-name: "@eslint/js"
        update-types:
          - version-update:semver-major
      - dependency-name: "@eslint/eslintrc"
        update-types:
          - version-update:semver-major
      # The rest of the pins, added 2026-08-31 when the grouping experiment
      # made the size of this list visible. Every one is a major this project
      # has actually decided against, not a routine bump nobody got round to,
      # and every one carries the condition that lifts it. Without the lift
      # line an ignore becomes a permanent silence nobody remembers choosing.
      #
      # Weigh each addition: `ignore` cannot filter by dependency type and it
      # applies to security updates too, so an entry here means not hearing
      # about a vulnerability in that package either. That is tolerable for
      # build tooling that never ships to a user, and would not be for a
      # runtime dependency.
      #
      # typescript 7 removes `moduleResolution: node10`, which three tsconfigs
      # still set as its alias `node`: apps/streamflow, packages/shared and
      # infra/lambda/feedback-classifier. Observed 2026-08-31 as TS5108 in a
      # Vercel build. Lift once those three move to `node16` or `bundler`,
      # which is a migration rather than a bump.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
      # tailwindcss 4 moves the PostCSS plugin to its own `@tailwindcss/postcss`
      # package and replaces `tailwind.config.ts` with CSS first `@theme`. This
      # repo's whole design system lives in `terminal.css` custom properties
      # with a measured two palette contrast model, so it is a project, not an
      # upgrade. Observed 2026-08-31 failing the Vercel build on #42. Lift when
      # someone does that migration deliberately.
      - dependency-name: tailwindcss
        update-types:
          - version-update:semver-major
      # @types/node tracks the Node major it describes. The repo requires Node
      # 22, so types for 26 describe a runtime this project does not run.
      # Rejected twice already, closed as #5 and reopened as #43. Lift when the
      # runtime itself moves.
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
      # The NestJS tooling family follows the framework major. apps/api runs
      # NestJS 11, so 12 for the CLI, schematics or testing package would sit
      # ahead of the framework it drives. Lift together with the framework.
      - dependency-name: "@nestjs/cli"
        update-types:
          - version-update:semver-major
      - dependency-name: "@nestjs/schematics"
        update-types:
          - version-update:semver-major
      - dependency-name: "@nestjs/testing"
        update-types:
          - version-update:semver-major
      # eslint 10 does not work here yet. The visible symptom is the peer
      # range on eslint-config-next@15, which stops at eslint ^9 and is what
      # killed Vercel's `npm install` on PR #4. eslint-config-next@16 widens
      # that to >=9.0.0, but taking it only moves the failure later: the
      # config bundles eslint-plugin-react, whose newest release (7.37.5)
      # still peers eslint ^9.7 and throws `contextOrFilename.getFilename is
      # not a function` on every apps/web file under eslint 10. Verified by
      # trial install, 2026-08-22. Lift this when eslint-plugin-react ships
      # eslint 10 support (typescript-eslint already has it, from 8.67).
      - dependency-name: eslint
        update-types:
          - version-update:semver-major
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps-dev)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: chore(ci)

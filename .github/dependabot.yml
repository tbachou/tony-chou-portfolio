version: 2

# Beta is feature frozen but still maintained (spec 0004), and the rest of the
# repo is actively built on. Either way the risk is the same: nobody notices a
# dependency going bad until an unrelated `npm audit` happens to be run. This
# turns that into a notification.
#
# Updates are GROUPED on purpose. A portfolio repo does not want twenty open
# pull requests; it wants one to look at on a Monday. Security updates are
# ungrouped and separate so they are never buried in a routine bump.
updates:
  - package-ecosystem: npm
    # Root only: npm workspaces means this one manifest covers apps/web,
    # apps/api and packages/shared.
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # PRODUCTION majors stay out of the groups, so a breaking change to
      # something that actually ships always arrives as its own pull request
      # with its own changelog to read. The known one today is Next 16, which
      # the sharp/libvips advisories require and which `npm audit fix` will
      # not do without --force.
      production-minor-and-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
      # DEVELOPMENT majors are grouped, which reverses the rule above on
      # purpose. Measured 2026-08-31: seventeen Dependabot pull requests had
      # been opened in this repo's life, two merged and eight closed, and the
      # open set had grown to seven against a config whose stated goal was one
      # to read on a Monday. Four of the seven were dev-dependency majors
      # arriving one per package (tailwindcss 4, @types/node 26, archiver 8,
      # @nestjs/schematics 12), none of which this project intends to take.
      # @types/node had already been closed once as #5 and came straight back
      # as #43, because closing a pull request records no decision anywhere.
      #
      # A dev-dependency major does not need its changelog read the way a
      # shipped one does: it either builds and passes the suites or it does
      # not, and that verdict is the same whether it arrives alone or with
      # three others. Grouping them trades "which of the four broke it" for
      # one pull request a week instead of four, which is the trade this repo
      # wants. Split a package back out with its own `ignore` entry, the way
      # eslint is handled below, when its verdict is durable.
      development:
        dependency-type: development
        update-types:
          - minor
          - patch
          - major
    ignore:
      # NOTE: `ignore` cannot filter by dependency-type, and it applies to
      # security updates as well as routine ones. So every entry here is a
      # deliberate decision to not hear about a package, including when the
      # reason would be a vulnerability. Keep the list short and named; never
      # reach for a `dependency-name: "*"` major rule, which would silence the
      # Next 16 upgrade the sharp/libvips advisories need.
      #
      # This entry now does a second job. With development majors grouped
      # above, an eslint 10 bump would land inside that group and fail it as a
      # whole, so removing this would not just re-open a known-bad upgrade, it
      # would break every grouped dev pull request until someone noticed why.
      #
      # Naming `eslint` alone was not enough, and the grouping above is what
      # exposed it. `@eslint/js` and `@eslint/eslintrc` ship in lockstep with
      # eslint, and `@eslint/js@10` peer requires `eslint@^10`, so bumping it
      # while eslint is held at 9 cannot install at all. Proven on 2026-08-31:
      # the first grouped development pull request (#49, twenty updates) took
      # `@eslint/js` to 10.0.1 and died on Vercel with an ERESOLVE before any
      # build step ran, holding nineteen good updates hostage to one bad one.
      #
      # Listed by name rather than as `@eslint/*` on purpose: a wildcard that
      # turns out not to match fails silently, which is the same class of
      # mistake as the one this entry is fixing. A new `@eslint/` sibling
      # entering the manifests needs adding here by hand.
      #
      # `eslint-config-next@16` is deliberately NOT ignored. It widens its
      # eslint peer to >=9.0.0, so it installs fine against eslint 9 and is
      # part of the path off this pin rather than another thing blocking it.
      - dependency-name: "@eslint/js"
        update-types:
          - version-update:semver-major
      - dependency-name: "@eslint/eslintrc"
        update-types:
          - version-update:semver-major
      # eslint 10 does not work here yet. The visible symptom is the peer
      # range on eslint-config-next@15, which stops at eslint ^9 and is what
      # killed Vercel's `npm install` on PR #4. eslint-config-next@16 widens
      # that to >=9.0.0, but taking it only moves the failure later: the
      # config bundles eslint-plugin-react, whose newest release (7.37.5)
      # still peers eslint ^9.7 and throws `contextOrFilename.getFilename is
      # not a function` on every apps/web file under eslint 10. Verified by
      # trial install, 2026-08-22. Lift this when eslint-plugin-react ships
      # eslint 10 support (typescript-eslint already has it, from 8.67).
      - dependency-name: eslint
        update-types:
          - version-update:semver-major
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps-dev)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: chore(ci)

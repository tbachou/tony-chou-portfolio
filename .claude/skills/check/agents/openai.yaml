# OpenAI Codex adapter. This file supplies the interface metadata Codex shows in
# its agent picker. The skill's actual instructions live in ../SKILL.md, which the
# Agent Skills client installs alongside this file and loads when the skill runs.
interface:
  display_name: "Check"
  short_description: "Drive the real app and prove a change works before merge"
  default_prompt: "Run the check skill: read its SKILL.md, then follow modes/verify.md to drive the real app and prove the change works against its spec. This is runtime proof, not a code review."
